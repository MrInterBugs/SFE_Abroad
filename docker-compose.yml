services:
  landing:
    image: nginx:alpine
    container_name: sfe_landing
    restart: unless-stopped
    volumes:
      - ./landing/index.html:/usr/share/nginx/html/index.html:ro
      - ./landing/ads.txt:/usr/share/nginx/html/ads.txt:ro
      - ./landing/robots.txt:/usr/share/nginx/html/robots.txt:ro
      - ./landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.route-landing.rule=Host(`aedanl.com`) || Host(`www.aedanl.com`)"
      - "traefik.http.services.route-landing.loadbalancer.server.port=80"

  student-loan-app:
    build: .
    container_name: sfe_web_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL:-https://sfe.aedanl.com}
    volumes:
      - ./data:/usr/src/app/data
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.route-webapp.rule=Host(`sfe.aedanl.com`)"
      - "traefik.http.services.route-webapp.loadbalancer.server.port=3000"
      - "traefik.http.routers.route-webapp.middlewares=sfe@file"

networks:
  traefik_default:
    external: true
